<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon Swim</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { background:#04070f; }
  body {
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
    color:#eaf2ff; min-height:100vh;
    display:flex; justify-content:center; align-items:flex-start;
    background:radial-gradient(1200px 700px at 50% -10%, #0a1830 0%, #04070f 60%);
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  #wrap { width:100%; max-width:480px; padding:10px 12px 18px; }
  #hud { display:flex; align-items:flex-start; justify-content:space-between; padding:8px 4px; }
  #scoreBox {
    background:rgba(10,16,34,.85); border:2px solid #1d2c55; border-radius:16px;
    padding:6px 16px 8px; text-align:center; min-width:92px;
  }
  #scoreBox .num { font-size:30px; font-weight:bold; color:#35e0ff; text-shadow:0 0 12px #35e0ff; line-height:1; }
  #scoreBox .lbl { font-size:12px; font-weight:bold; letter-spacing:3px; color:#eaf2ff; }
  #topBtns { display:flex; gap:8px; align-items:center; }
  .hbtn {
    background:rgba(10,16,34,.85); color:#fff; border:2px solid #1d2c55; border-radius:14px;
    font-size:17px; font-weight:bold; padding:8px 12px; cursor:pointer;
  }
  .hbtn:active { transform:scale(.94); }
  #bestPill {
    background:rgba(10,16,34,.85); border:2px solid #1d2c55; border-radius:999px;
    font-size:13px; font-weight:bold; color:#c9d6f5; padding:9px 14px; letter-spacing:1px;
  }
  #bestPill b { color:#ffd94d; }
  #stage {
    position:relative; width:100%; border-radius:16px; overflow:hidden;
    border:2px solid #1d3a5f; box-shadow:0 0 24px rgba(53,224,255,.18);
    background:#060b18; touch-action:none;
  }
  canvas { display:block; width:100%; height:auto; }
  #overPop {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px;
    background:rgba(4,8,18,.78); z-index:5;
  }
  .ptitle { font-size:38px; font-weight:bold; color:#fff; text-shadow:0 0 16px #35e0ff; letter-spacing:2px; }
  #newBestTag { color:#ffd94d; font-weight:bold; font-size:18px; text-shadow:0 0 10px #ffd94d; }
  .prow { display:flex; gap:18px; align-items:baseline; font-size:15px; letter-spacing:3px; color:#c9d6f5; }
  .prow b { font-size:30px; color:#35e0ff; text-shadow:0 0 10px #35e0ff; letter-spacing:0; }
  #retryBtn {
    margin-top:10px; background:linear-gradient(180deg,#3dffb0,#17b978);
    color:#04220f; font-size:20px; font-weight:bold; letter-spacing:2px;
    border:none; border-radius:999px; padding:14px 48px; cursor:pointer;
    box-shadow:0 0 18px rgba(61,255,176,.5); font-family:inherit;
  }
  #retryBtn:active { transform:scale(.94); }
  #hint { text-align:center; font-size:13px; color:#9fb4e8; margin:10px 4px 4px; line-height:1.6; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div id="scoreBox"><div class="num" id="score">0</div><div class="lbl">SCORE</div></div>
    <div id="topBtns">
      <button class="hbtn" id="pauseBtn" title="Pause">⏸</button>
      <div id="bestPill">BEST <b id="best">0</b></div>
      <button class="hbtn" id="muteBtn" title="Sound">🔊</button>
    </div>
  </div>
  <div id="stage"><canvas id="game"></canvas>
    <div id="overPop" style="display:none">
      <div class="ptitle">GAME OVER</div>
      <div id="newBestTag" style="display:none">★ NEW BEST! ★</div>
      <div class="prow"><span>SCORE</span><b id="finalScore">0</b></div>
      <div class="prow"><span>BEST</span><b id="finalBest">0</b></div>
      <button id="retryBtn">↻ RETRY</button>
    </div>
  </div>
  <div id="hint"><b>HOLD</b> = rise &nbsp;/&nbsp; <b>LET GO</b> = fall<br>Don't touch the glowing walls — grab orbs &amp; power-ups!</div>
</div>
<script>
'use strict';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 400, H = 640;
cv.width = W; cv.height = H;

/* ---------- audio ---------- */
let AC = null, muted = false;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, when) {
  if (muted) return;
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + (when || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol || 0.16, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noiseBurst(dur, vol) {
  if (muted) return;
  const ac = audio(); if (!ac) return;
  const n = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(); s.buffer = buf;
  const g = ac.createGain(); g.gain.value = vol || 0.25;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 800;
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
}
const sfx = {
  pickup(s)  { const f = Math.min(500 + s * 25, 1400); tone(f, 0.09, 'sine', 0.14); tone(f * 1.5, 0.07, 'sine', 0.08); },
  power()    { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.15, 'triangle', 0.14, i * 0.07)); },
  death()    { noiseBurst(0.4, 0.3); tone(160, 0.5, 'sawtooth', 0.16); tone(90, 0.6, 'sawtooth', 0.14, 0.1); },
  shieldUp() { tone(392, 0.12, 'triangle', 0.15); tone(784, 0.18, 'triangle', 0.15, 0.1); },
  shieldHit(){ noiseBurst(0.25, 0.28); tone(700, 0.2, 'square', 0.1); },
  click()    { tone(600, 0.06, 'triangle', 0.1); },
  start()    { tone(330, 0.1, 'triangle', 0.14); tone(660, 0.15, 'triangle', 0.14, 0.09); }
};

/* ---------- state ---------- */
let state = 'title'; // title | playing | paused | over
let score = 0, best = parseInt(localStorage.getItem('neonSwimBest') || '0', 10) || 0;
let fish, walls, pellets, powers, parts, popups, bubbles, plankton, corals;
let scrollX = 0, speed = 170, holding = false;
let shield = false, slowT = 0, magnetT = 0, invulnT = 0;
let streak = 0, pelletT = 0, powerT = 8, time = 0, shake = 0, newBest = false;

function reset() {
  fish = { x: 140, y: H / 2, vy: 0, r: 15, rot: 0 };
  pellets = []; powers = []; parts = []; popups = []; bubbles = []; corals = [];
  plankton = [];
  for (let i = 0; i < 60; i++) plankton.push({ x: Math.random() * W, y: Math.random() * H, r: 0.6 + Math.random() * 1.8, sp: 12 + Math.random() * 30 });
  scrollX = 0; speed = 170;
  shield = false; slowT = 0; magnetT = 0; invulnT = 0;
  score = 0; streak = 0; pelletT = 0.8; powerT = 9; shake = 0; newBest = false;
  updateHUD();
}
function startGame() {
  audio(); reset(); state = 'playing';
  document.getElementById('overPop').style.display = 'none';
  sfx.start();
}
function updateHUD() {
  document.getElementById('score').textContent = Math.floor(score);
  document.getElementById('best').textContent = best;
}
function addPopup(x, y, text, color, size) {
  popups.push({ x, y, text, color: color || '#fff', size: size || 17, life: 1 });
}
function boom(x, y, color, n, spd) {
  for (let i = 0; i < (n || 14); i++) {
    const a = Math.random() * 6.28, s = (spd || 150) * (0.3 + Math.random() * 0.9);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 1.5 + Math.random() * 3, life: 1, color });
  }
}
function bubble(x, y, n) {
  for (let i = 0; i < (n || 1); i++)
    bubbles.push({ x: x + (Math.random() - 0.5) * 10, y, vy: -40 - Math.random() * 60, r: 1.5 + Math.random() * 3.5, life: 1 });
}

/* ---------- tunnel walls ---------- */
function topYAt(x) {
  const s = x + scrollX;
  return 78 + 34 * Math.sin(s * 0.008) + 18 * Math.sin(s * 0.021 + 1.7);
}
function gapAt(x) {
  const s = x + scrollX;
  const base = Math.max(258 - score * 0.10, 182);
  return base + 26 * Math.sin(s * 0.006 + 0.6);
}
function botYAt(x) { return topYAt(x) + gapAt(x); }

/* ---------- gameplay ---------- */
function curSpeed() {
  const s = Math.min(170 + score * 0.12, 330);
  return slowT > 0 ? s * 0.55 : s;
}
function spawnPellet() {
  const x = W + 30;
  const y = topYAt(x) + 40 + Math.random() * (gapAt(x) - 80);
  pellets.push({ x, y, r: 10, ph: Math.random() * 6.28 });
}
function spawnPower() {
  const x = W + 30;
  const kinds = ['shield', 'slow', 'magnet'];
  const kind = kinds[(Math.random() * kinds.length) | 0];
  const y = topYAt(x) + 50 + Math.random() * (gapAt(x) - 100);
  powers.push({ x, y, kind, r: 14, ph: Math.random() * 6.28 });
}
function hitWall() {
  if (invulnT > 0) return;
  if (shield) {
    shield = false; invulnT = 1.2;
    boom(fish.x, fish.y, '#35e0ff', 26, 220);
    addPopup(fish.x, fish.y - 30, 'SHIELD DOWN!', '#35e0ff', 19);
    sfx.shieldHit(); shake = 8;
    return;
  }
  state = 'over';
  shake = 0;
  boom(fish.x, fish.y, '#ff5d7a', 40, 260);
  boom(fish.x, fish.y, '#35e0ff', 24, 200);
  sfx.death();
  if (Math.floor(score) > best) { best = Math.floor(score); newBest = true; localStorage.setItem('neonSwimBest', String(best)); }
  document.getElementById('finalScore').textContent = Math.floor(score);
  document.getElementById('finalBest').textContent = best;
  document.getElementById('newBestTag').style.display = newBest ? 'block' : 'none';
  document.getElementById('overPop').style.display = 'flex';
  updateHUD();
}
function update(dt) {
  time += dt;
  const spd = curSpeed();
  scrollX += spd * dt;

  // fish physics: hold = rise, release = fall
  const target = holding ? -390 : 540;
  const k = Math.min(1, dt * (holding ? 13 : 8));
  fish.vy += (target - fish.vy) * k;
  fish.y += fish.vy * dt;
  fish.rot += ((Math.max(-0.45, Math.min(0.55, fish.vy / 800))) - fish.rot) * Math.min(1, dt * 10);
  if (Math.random() < 0.25) bubble(fish.x - 14, fish.y - 2, 1);

  // wall collision (sample across fish body)
  for (const ox of [-9, 0, 9]) {
    const px = fish.x + ox;
    if (fish.y - fish.r < topYAt(px) + 4 || fish.y + fish.r > botYAt(px) - 4) { hitWall(); break; }
  }
  if (state !== 'playing') return;

  score += dt * 6;
  if (Math.floor(score) > best) { best = Math.floor(score); localStorage.setItem('neonSwimBest', String(best)); }

  // timers
  if (slowT > 0) slowT -= dt;
  if (magnetT > 0) magnetT -= dt;
  if (invulnT > 0) invulnT -= dt;

  // spawn
  pelletT -= dt;
  if (pelletT <= 0) { spawnPellet(); pelletT = 0.9 + Math.random() * 0.7; }
  powerT -= dt;
  if (powerT <= 0) { spawnPower(); powerT = 11 + Math.random() * 7; }

  // pellets
  for (let i = pellets.length - 1; i >= 0; i--) {
    const p = pellets[i];
    p.x -= spd * dt; p.ph += dt * 5;
    if (magnetT > 0) {
      const dx = fish.x - p.x, dy = fish.y - p.y, d = Math.hypot(dx, dy);
      if (d < 150 && d > 1) { p.x += dx / d * 260 * dt; p.y += dy / d * 260 * dt; }
    }
    if (Math.hypot(p.x - fish.x, p.y - fish.y) < fish.r + p.r + 2) {
      pellets.splice(i, 1);
      streak++;
      const gain = 10 + Math.min(streak, 20);
      score += gain;
      boom(p.x, p.y, '#ffd94d', 10, 130);
      addPopup(p.x, p.y - 12, '+' + gain, '#ffd94d');
      if (streak > 0 && streak % 10 === 0) { score += 25; addPopup(fish.x, fish.y - 34, 'STREAK x' + streak + '  +25', '#ff9ff3', 19); }
      sfx.pickup(streak);
      updateHUD();
      continue;
    }
    if (p.x < -30) { pellets.splice(i, 1); streak = 0; }
  }

  // power-ups
  const PCOL = { shield: '#35e0ff', slow: '#b45cff', magnet: '#ff6b6b' };
  const PNAME = { shield: 'SHIELD!', slow: 'SLOW-MO!', magnet: 'MAGNET!' };
  for (let i = powers.length - 1; i >= 0; i--) {
    const p = powers[i];
    p.x -= spd * dt; p.ph += dt * 4;
    if (Math.hypot(p.x - fish.x, p.y - fish.y) < fish.r + p.r + 4) {
      powers.splice(i, 1);
      if (p.kind === 'shield') { shield = true; sfx.shieldUp(); }
      else if (p.kind === 'slow') { slowT = 6; }
      else { magnetT = 8; }
      boom(p.x, p.y, PCOL[p.kind], 18, 170);
      addPopup(p.x, p.y - 14, PNAME[p.kind], PCOL[p.kind], 20);
      sfx.power();
      continue;
    }
    if (p.x < -30) powers.splice(i, 1);
  }

  // particles / bubbles / plankton / corals
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.98; q.vy *= 0.98; q.life -= dt * 1.7;
    if (q.life <= 0) parts.splice(i, 1);
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y += b.vy * dt; b.x -= spd * 0.3 * dt; b.life -= dt * 0.9;
    if (b.life <= 0 || b.y < -10) bubbles.splice(i, 1);
  }
  for (const pl of plankton) {
    pl.x -= pl.sp * dt * (slowT > 0 ? 0.55 : 1);
    if (pl.x < -5) { pl.x = W + 5; pl.y = Math.random() * H; }
  }
  if (Math.random() < dt * 0.9) {
    const top = Math.random() < 0.5;
    corals.push({ x: W + 20, top, h: 26 + Math.random() * 34, seed: Math.random() * 100 });
  }
  for (let i = corals.length - 1; i >= 0; i--) {
    corals[i].x -= spd * dt;
    if (corals[i].x < -40) corals.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y -= 40 * dt; p.life -= dt * 1.1;
    if (p.life <= 0) popups.splice(i, 1);
  }
  shake = Math.max(0, shake - dt * 28);
  updateHUD();
}

/* ---------- render ---------- */
function drawFish() {
  ctx.save();
  ctx.translate(fish.x, fish.y);
  ctx.rotate(fish.rot);
  if (invulnT > 0 && Math.floor(time * 12) % 2 === 0) ctx.globalAlpha = 0.35;
  const wig = Math.sin(time * 10) * 4;
  // tail (pink)
  ctx.fillStyle = '#ff4fd8';
  ctx.shadowColor = '#ff4fd8'; ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(-16, 0); ctx.lineTo(-30, -11 + wig); ctx.lineTo(-30, 11 + wig);
  ctx.closePath(); ctx.fill();
  // body
  const bg = ctx.createLinearGradient(0, -13, 0, 13);
  bg.addColorStop(0, '#8ff5ff'); bg.addColorStop(1, '#2bc8ec');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(0, 0, 21, 13, 0, 0, 6.29); ctx.fill();
  // white stripes
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.shadowBlur = 0;
  for (const sx of [-8, 0, 8]) {
    ctx.beginPath(); ctx.ellipse(sx, 0, 3.4, 12.2, 0.12, 0, 6.29); ctx.fill();
  }
  // fin (pink)
  ctx.fillStyle = '#ff7ae2';
  ctx.beginPath(); ctx.ellipse(-2, 9, 7, 4.5, 0.5, 0, 6.29); ctx.fill();
  // eye
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(10, -3.5, 4.6, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#0b1526';
  ctx.beginPath(); ctx.arc(11.4, -3.5, 2.4, 0, 6.29); ctx.fill();
  ctx.restore();
  // shield ring
  if (shield) {
    ctx.save();
    ctx.strokeStyle = '#35e0ff'; ctx.lineWidth = 3;
    ctx.shadowColor = '#35e0ff'; ctx.shadowBlur = 14;
    ctx.globalAlpha = 0.75 + 0.25 * Math.sin(time * 6);
    ctx.beginPath(); ctx.arc(fish.x, fish.y, fish.r + 10, 0, 6.29); ctx.stroke();
    ctx.restore();
  }
}
function drawWalls() {
  for (const top of [true, false]) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-4, top ? -4 : H + 4);
    for (let x = -4; x <= W + 8; x += 8) ctx.lineTo(x, top ? topYAt(x) : botYAt(x));
    ctx.lineTo(W + 8, top ? -4 : H + 4);
    ctx.closePath();
    const g = top ? ctx.createLinearGradient(0, 0, 0, 160) : ctx.createLinearGradient(0, H, 0, H - 160);
    g.addColorStop(0, 'rgba(20,60,110,.55)'); g.addColorStop(1, 'rgba(8,20,44,.05)');
    ctx.fillStyle = g; ctx.fill();
    // glowing edge
    ctx.beginPath();
    for (let x = -4; x <= W + 8; x += 8) { const y = top ? topYAt(x) : botYAt(x); x === -4 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.strokeStyle = '#35e0ff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.shadowColor = '#35e0ff'; ctx.shadowBlur = 16;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.4; ctx.shadowBlur = 0;
    ctx.stroke();
    ctx.restore();
  }
}
function drawCoral(c) {
  const y0 = c.top ? topYAt(c.x) : botYAt(c.x);
  const dir = c.top ? 1 : -1;
  ctx.save();
  ctx.strokeStyle = '#35e0ff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.shadowColor = '#35e0ff'; ctx.shadowBlur = 8;
  ctx.globalAlpha = 0.8;
  function branch(x, y, len, ang, w) {
    if (len < 8 || w < 0.8) return;
    const nx = x + Math.cos(ang) * len, ny = y + Math.sin(ang) * len;
    ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(nx, ny); ctx.stroke();
    branch(nx, ny, len * 0.7, ang - 0.5 - (c.seed % 0.4), w * 0.7);
    branch(nx, ny, len * 0.7, ang + 0.5 + (c.seed % 0.3), w * 0.7);
  }
  branch(c.x, y0, c.h * 0.55, c.top ? Math.PI / 2 : -Math.PI / 2, 4);
  ctx.restore();
}
function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#081226'); bg.addColorStop(1, '#04070f');
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);
  if (slowT > 0) { ctx.fillStyle = 'rgba(120,80,255,.06)'; ctx.fillRect(-20, -20, W + 40, H + 40); }

  for (const pl of plankton) {
    ctx.globalAlpha = 0.5; ctx.fillStyle = '#7fa8d8';
    ctx.beginPath(); ctx.arc(pl.x, pl.y, pl.r, 0, 6.29); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const c of corals) drawCoral(c);
  drawWalls();

  // pellets (golden orbs)
  for (const p of pellets) {
    const bob = Math.sin(p.ph) * 3;
    ctx.save();
    ctx.shadowColor = '#ffd94d'; ctx.shadowBlur = 16;
    const g = ctx.createRadialGradient(p.x - 3, p.y - 3 + bob, 1, p.x, p.y + bob, p.r);
    g.addColorStop(0, '#fff6c9'); g.addColorStop(0.55, '#ffd94d'); g.addColorStop(1, '#c8930a');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y + bob, p.r, 0, 6.29); ctx.fill();
    ctx.restore();
  }
  // power-ups
  const PCOL = { shield: '#35e0ff', slow: '#b45cff', magnet: '#ff6b6b' };
  const PICO = { shield: '⛨', slow: '⏳', magnet: '🧲' };
  for (const p of powers) {
    const bob = Math.sin(p.ph) * 3, col = PCOL[p.kind];
    const pu = 1 + Math.sin(time * 5 + p.ph) * 0.08;
    ctx.save();
    ctx.translate(p.x, p.y + bob); ctx.scale(pu, pu);
    ctx.strokeStyle = col; ctx.lineWidth = 3.5;
    ctx.shadowColor = col; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 6.29); ctx.stroke();
    ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = '15px Trebuchet MS';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(PICO[p.kind], 0, 1);
    ctx.restore();
  }

  if (state !== 'over') drawFish();

  for (const q of parts) {
    ctx.globalAlpha = Math.max(0, q.life);
    ctx.fillStyle = q.color;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r * q.life + 0.5, 0, 6.29); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(160,220,255,.5)'; ctx.lineWidth = 1;
  for (const b of bubbles) {
    ctx.globalAlpha = Math.max(0, b.life) * 0.7;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.29); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // active power-up timers
  ctx.textAlign = 'left';
  let ty = 20;
  ctx.font = 'bold 13px Trebuchet MS';
  if (shield) { ctx.fillStyle = '#35e0ff'; ctx.fillText('🛡 SHIELD', 10, ty); ty += 18; }
  if (slowT > 0) { ctx.fillStyle = '#b45cff'; ctx.fillText('⏳ SLOW ' + Math.ceil(slowT) + 's', 10, ty); ty += 18; }
  if (magnetT > 0) { ctx.fillStyle = '#ff6b6b'; ctx.fillText('🧲 MAGNET ' + Math.ceil(magnetT) + 's', 10, ty); ty += 18; }
  if (streak >= 5) {
    ctx.textAlign = 'center'; ctx.font = 'bold 20px Trebuchet MS';
    ctx.fillStyle = '#ff9ff3'; ctx.shadowColor = '#ff9ff3'; ctx.shadowBlur = 10;
    ctx.fillText('STREAK x' + streak, W / 2, 30);
    ctx.shadowBlur = 0;
  }

  ctx.textAlign = 'center';
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6));
    ctx.font = 'bold ' + p.size + 'px Trebuchet MS';
    ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 8;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  if (state === 'title' || state === 'paused') {
    ctx.fillStyle = 'rgba(4,8,18,.62)'; ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#35e0ff'; ctx.shadowBlur = 14;
    ctx.font = 'bold 42px Trebuchet MS';
    ctx.fillText(state === 'title' ? 'NEON SWIM' : 'PAUSED', W / 2, H / 2 - 120);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#c9d6f5'; ctx.font = '16px Trebuchet MS';
    if (state === 'title') {
      ctx.fillText('HOLD = rise  /  LET GO = fall', W / 2, H / 2 - 60);
      ctx.fillText("Don't touch the glowing walls!", W / 2, H / 2 - 36);
      ctx.fillStyle = '#54ff9f'; ctx.font = 'bold 21px Trebuchet MS';
      ctx.fillText('— TAP TO START —', W / 2, H / 2 + 20);
    } else {
      ctx.fillStyle = '#54ff9f'; ctx.font = 'bold 21px Trebuchet MS';
      ctx.fillText('— TAP TO RESUME —', W / 2, H / 2 - 40);
    }
  }
  ctx.restore();
}

/* ---------- loop ---------- */
let last = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0.016);
  last = t;
  if (state === 'playing') update(dt);
  else time += dt;
  render();
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);

/* ---------- input ---------- */
const stage = document.getElementById('stage');
function press(e) {
  if (e) e.preventDefault();
  audio();
  if (state === 'title') startGame();
  else if (state === 'paused') { state = 'playing'; sfx.click(); }
  if (state === 'playing') holding = true;
}
function release(e) { if (e) e.preventDefault(); holding = false; }
stage.addEventListener('pointerdown', press);
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);
stage.addEventListener('pointerleave', release);
stage.addEventListener('contextmenu', e => e.preventDefault());

document.getElementById('retryBtn').addEventListener('click', e => {
  e.preventDefault(); e.stopPropagation();
  startGame();
});
document.getElementById('pauseBtn').addEventListener('click', e => {
  e.preventDefault(); e.stopPropagation(); audio();
  if (state === 'playing') { state = 'paused'; sfx.click(); }
  else if (state === 'paused') { state = 'playing'; sfx.click(); }
});
document.getElementById('muteBtn').addEventListener('click', e => {
  e.preventDefault(); e.stopPropagation(); audio();
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
});
window.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); if (!e.repeat) press(); }
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }
  if (e.key === 'm' || e.key === 'M') document.getElementById('muteBtn').click();
});
window.addEventListener('keyup', e => {
  if (e.key === ' ' || e.key === 'ArrowUp') release();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') state = 'paused'; });
</script>
</body>
